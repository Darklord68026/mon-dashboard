name: 🤖 Auto Changelog

on:
  push:
    branches:
      - main
    paths:
      - 'client/**' # Seulement si on touche au frontend

jobs:
  update-changelog:
    # On évite la boucle infinie (si le commit vient du bot, on stop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important pour pouvoir pusher

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧠 Lancer l'IA (Script)
        id: script
        run: |
          # On récupère le dernier message de commit
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Analyse du commit : $COMMIT_MSG"
          
          # On lance le script Node
          cd client
          node scripts/update-changelog.js "$COMMIT_MSG"
        continue-on-error: true

      - name: 💾 Sauvegarder et Push
        run: |
          # Configurer Git au nom du Robot
          git config --global user.name "🤖 Changelog Bot"
          git config --global user.email "bot@mondashboard.com"
          
          # Vérifier si le fichier a changé
          if [[ `git status --porcelain client/src/data/changelog.json` ]]; then
            git add client/src/data/changelog.json
            git commit -m "docs: mise à jour du changelog [skip ci]"
            git push
            echo "🚀 Changelog mis à jour sur GitHub !"
          else
            echo "💤 Rien à mettre à jour."
          fi