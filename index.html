<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mon Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="assets/analyse-des-donnees.png" type="image/png">
    
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script type="module" src="js/app.js"></script>

    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4dabf7/ffffff?text=D">
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(console.error);
        }
    </script>
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>Bienvenue</h2>
            <input type="text" id="username" placeholder="Utilisateur" autocomplete="username">
            <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
            
            <div class="auth-buttons">
                <button type="button">Se connecter</button>
                <button type="button" class="secondary-btn">S'inscrire</button>
            </div>
            <p id="auth-error"></p>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden">
        
        <header>
            <button id="burger-btn" class="burger-icon">☰</button>
            <div id="clock-container" class="clock-floating">
                <div id="clock">00:00</div>
                <div id="clock-seconds">00</div>
            </div>
        </header>
        
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header flex-between">
                <h3>Menu</h3>
                <button id="close-sidebar-btn" class="btn-icon">&times;</button>
            </div>
            <div class="sidebar-content">
                <button id="open-settings-btn" class="menu-item">⚙️ Paramètres</button>
                <button id="logout-btn" class="menu-item danger">Déconnexion</button>
            </div>
            <footer id="sidebar-display">
                <h3>Chargement...</h3>
            </footer>
        </nav>

        <main class="dashboard-container">
            <section class="widget weather-widget">
                <h2>Météo</h2>
                <div id="weather-display">Chargement...</div>
            </section>

            <section class="widget todo-widget">
                <h2>À faire</h2>

                <div class="input-group flex-between" style="margin-bottom: 15px; background: transparent; border: none; padding: 0;">
                    <select id="filter-tag" style="width: 48%; cursor: pointer;">
                        <option value="all">Tout voir</option>
                        </select>

                    <select id="sort-order" style="width: 48%; cursor: pointer;">
                        <option value="date-asc">📅 Urgent d'abord</option>
                        <option value="date-desc">📅 Moins urgent</option>
                        <option value="recent">✨ Récents</option>
                    </select>
                </div>

                <ul id="task-list"></ul>
                
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="Nouvelle tâche...">
                    <select id="task-category-select">
                        <option value="Général">Général</option>
                    </select>
                    <input type="date" id="task-date-input">
                    <button id="add-task-btn">Ajouter</button>
                </div>
            </section>
        </main>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-box">
            
            <div id="select-params">
                <div class="flex-between" style="margin-bottom: 20px;">
                    <h2>Paramètres</h2>
                    <button class="close-settings-btn btn-icon">&times;</button>
                </div>
                <button type="button" id="open-settings-tags-btn">🏷️ Gérer les Tags</button>
                <button type="button" id="open-settings-security-btn">🔒 Sécurité</button>
            </div>

            <div id="tags" class="hidden">
                <div class="flex-between" style="margin-bottom:20px;">
                    <h3 style="margin:0;">⚙️ Tags</h3>
                    <button class="close-settings-btn btn-icon">&times;</button>
                </div>
                
                <div id="settings-tags-list" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;"></div>
                
                <div class="add-tag-form">
                    <input type="text" id="new-tag-name" placeholder="Nom (ex: Sport)">
                    <input type="color" id="new-tag-color" value="#ff0000">
                    <button id="add-tag-btn">+</button>
                </div>
            </div>

            <div id="security" class="hidden">
                <div class="flex-between" style="margin-bottom: 20px;">
                    <h3 style="margin:0;">⚙️ Sécurité</h3>
                    <button class="close-settings-btn btn-icon">&times;</button>
                </div>

                <div id="update-password">
                    <input type="text" id="input-newPassword" placeholder="Nouveau mot de passe">
                    <button type="button" id="btn-updatePassword">Mettre à jour</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

</body>
</html>
